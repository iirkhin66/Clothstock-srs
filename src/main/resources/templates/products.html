<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Товары - ClothStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/products">ClothStock</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/products">Товары</a></li>
                <li class="nav-item" sec:authorize="hasRole('MANAGER')"><a class="nav-link" href="/report">Отчет</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" href="/users">Пользователи</a></li>
            </ul>
            <form class="d-flex" method="get" action="/products">
                <input class="form-control me-2" type="search" name="query" placeholder="Поиск (Артикул, Имя)">
                <button class="btn btn-outline-light" type="submit">Поиск</button>
            </form>
            <form method="post" action="/logout" class="ms-3">
                <button class="btn btn-danger" type="submit">Выход</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Список товаров</h2>
    <div sec:authorize="hasRole('MANAGER')" class="mb-3">
        <a href="/products/add" class="btn btn-success">Добавить товар</a>
    </div>

    <table class="table table-bordered table-striped align-middle">
        <thead>
        <tr>
            <th>Артикул</th>
            <th>Название</th>
            <th>Категория</th>
            <th>Размер</th>
            <th>Цена</th>
            <th>Остаток</th>
            <th>Статус</th>
            <th sec:authorize="hasRole('MANAGER')">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.sku}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.category}"></td>
            <td th:text="${product.size}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.stock}"></td>
            <td>
                <span th:text="${product.status}"></span>
                <div th:if="${product.status == 'На складе' and product.statusUpdatedAt != null}"
                     class="stock-timer badge bg-warning text-dark d-block mt-1"
                     th:data-updated-at="${product.statusUpdatedAt}"
                     th:data-id="${product.id}">
                </div>
            </td>
            <td sec:authorize="hasRole('MANAGER')">
                <form method="post" th:action="@{/products/{id}/status(id=${product.id})}" class="d-inline">
                    <select name="status" class="form-select form-select-sm d-inline w-auto">
                        <option value="На складе" th:selected="${product.status == 'На складе'}">На складе</option>
                        <option value="В торговом зале" th:selected="${product.status == 'В торговом зале'}">В торговом зале</option>
                        <option value="Продан" th:selected="${product.status == 'Продан'}">Продан</option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-primary">Ok</button>
                </form>
                <form method="post" th:action="@{/products/{id}/delete(id=${product.id})}" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const timers = document.querySelectorAll('.stock-timer');

        function updateTimers() {
            const now = new Date();
            timers.forEach(timer => {
                if (timer.dataset.processed === 'true') return;

                const updatedStr = timer.getAttribute('data-updated-at');
                if (!updatedStr) return;

                const updatedAt = new Date(updatedStr);
                const targetTime = new Date(updatedAt.getTime() + 30 * 60000);
                const diffMs = targetTime - now;

                if (diffMs <= 0) {
                    timer.textContent = "Перемещение...";
                    timer.dataset.processed = 'true';
                    const productId = timer.getAttribute('data-id');

                    fetch(`/products/${productId}/status?status=В торговом зале`, {
                        method: 'POST'
                    }).then(() => {
                        window.location.reload();
                    });
                } else {
                    const mins = Math.floor(diffMs / 60000);
                    const secs = Math.floor((diffMs % 60000) / 1000);
                    timer.textContent = `⏱ ${mins}:${secs.toString().padStart(2, '0')}`;
                }
            });
        }

        setInterval(updateTimers, 1000);
        updateTimers();
    });
</script>
</body>
</html>
