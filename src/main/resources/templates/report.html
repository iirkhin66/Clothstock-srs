<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Отчет - ClothStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4">Отчет о прибыли и убытках</h2>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Артикул</th>
            <th>Название</th>
            <th>Цена (Руб)</th>
            <th>Статус</th>
            <th>Прибыль</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}" th:if="${product.status == 'Продан'}">
            <td th:text="${product.sku}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.status}"></td>
            <td class="text-success" th:text="${product.price}"></td>
        </tr>
        </tbody>
    </table>
    <div class="text-end">
        <a href="/export/pdf" class="btn btn-danger">Скачать PDF</a>
        <a href="/export/csv" class="btn btn-success">Скачать Excel (CSV)</a>
        <a href="/products" class="btn btn-secondary">Вернуться</a>
    </div>
</div>
</body>
</html>
